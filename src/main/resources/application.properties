# ===========================================
# DATABASE CONFIGURATION (PostgreSQL)
# ===========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/edugame
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:mouadh123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.validation-timeout=3000

# ===========================================
# JPA / HIBERNATE
# ===========================================
# Dev par défaut (update) ; en prod configure SPRING_JPA_HIBERNATE_DDL_AUTO=validate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Flyway : applique les migrations avant Hibernate (ex. contrainte jeux.etat + BROUILLON)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# data.sql désactivé : pays/régions/villes sont chargés dynamiquement via Countries Now API
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===========================================
# SERVER
# ===========================================
server.port=8081
# Inscription avec photo (base64) peut dépasser 2 Mo
server.tomcat.max-http-form-post-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# ===========================================
# JWT CONFIGURATION
# ===========================================
jwt.secret=${JWT_SECRET:MySecureJWTSecretKey2024AuthBackendApplication!}
jwt.expiration=86400000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.test-connection=false

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# Timeout court pour ne jamais bloquer une requête HTTP
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000



# ===========================================
# APP CONFIGURATION
# ===========================================
app.frontend-url=http://localhost:3000
app.db.auto-create.enabled=${APP_DB_AUTO_CREATE_ENABLED:true}

# ===========================================
# AI (GOOGLE GEMINI)
# ===========================================
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=gemini-2.5-flash
ai.gemini.models=gemini-2.5-flash,gemini-1.5-flash
ai.gemini.timeout-ms=10000
ai.gemini.enabled=true
# Quiz IA : budgets pour limiter l'attente (voir AiQuizGenerationService).
# read-timeout relevé à 15s : un appel réel de génération de 5 questions prend ~8,3s mesuré en pratique
# (gemini-2.5-flash "thinking"), 6,5s le faisait expirer à tort et basculait inutilement sur Groq.
ai.quiz.connect-timeout-ms=1800
ai.quiz.read-timeout-ms=15000
ai.quiz.gemini-attempts-per-model=1
ai.quiz.max-gemini-models=1

# Couverture des jeux (Gemini Image : même clé GEMINI_API_KEY). Ordre = priorité.
# Perf: un modèle + timeouts/retry serrés limitent l’attente max (réajoutez un 2e modèle CSV si besoin).
ai.cover.gemini-enabled=true
ai.cover.gemini-models=gemini-2.5-flash-image
ai.cover.connect-timeout-ms=1500
ai.cover.read-timeout-ms=4800
ai.cover.gemini-max-retries=2
# Groq AI
groq.api.key=${GROQ_API_KEY:}
groq.enabled=true
# llama-3.1-8b-instant a ete retire du catalogue Groq (404 model_not_found) ; remplace par un modele
# actuellement disponible et compatible response_format=json_object (verifie manuellement).
groq.model=openai/gpt-oss-20b
groq.timeout-ms=8000

# ===========================================
# EXTERNAL ADS PROVIDER (OPEN SOURCE / SELF-HOSTED)
# ===========================================


# DEV QUICK START (same Spring Boot app as external provider mock)
# Uncomment to enable immediately with the built-in external ads API.
external.ads.enabled=true
external.ads.base-url=http://localhost:8081/api/ext-ads
external.ads.api-key=dev-ads-key

# ===========================================
# VOICE WORKSHOP (ATELIER ORAL)
# ===========================================
voice.scoring.rules-version=voice-v1
voice.transcription.timeout-ms=15000
voice.transcription.browser-fallback-enabled=true