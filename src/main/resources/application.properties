# ===========================================
# DATABASE CONFIGURATION (PostgreSQL)
# ===========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/edugame
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:mouadh123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================================
# JPA / HIBERNATE
# ===========================================
# Dev par défaut (update) ; en prod configure SPRING_JPA_HIBERNATE_DDL_AUTO=validate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Flyway : applique les migrations avant Hibernate (ex. contrainte jeux.etat + BROUILLON)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# data.sql désactivé : pays/régions/villes sont chargés dynamiquement via Countries Now API
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===========================================
# SERVER
# ===========================================
server.port=8081
# Inscription avec photo (base64) peut dépasser 2 Mo
server.tomcat.max-http-form-post-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# ===========================================
# JWT CONFIGURATION
# ===========================================
jwt.secret=${JWT_SECRET:MySecureJWTSecretKey2024AuthBackendApplication!}
jwt.expiration=86400000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# Timeout pour l'envoi d'email (évite les blocages)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000



# ===========================================
# APP CONFIGURATION
# ===========================================
app.frontend-url=http://localhost:3000
app.db.auto-create.enabled=${APP_DB_AUTO_CREATE_ENABLED:true}

# ===========================================
# AI (GOOGLE GEMINI)
# ===========================================
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=gemini-2.5-flash
ai.gemini.models=gemini-2.5-flash,gemini-1.5-flash
ai.gemini.timeout-ms=10000
ai.gemini.enabled=true
# Quiz IA : budgets serrés pour limiter l’attente (voir AiQuizGenerationService)
ai.quiz.connect-timeout-ms=1800
ai.quiz.read-timeout-ms=6500
ai.quiz.gemini-attempts-per-model=1
ai.quiz.max-gemini-models=1

# Couverture des jeux (Gemini Image : même clé GEMINI_API_KEY). Ordre = priorité.
# Perf: un modèle + timeouts/retry serrés limitent l’attente max (réajoutez un 2e modèle CSV si besoin).
ai.cover.gemini-enabled=true
ai.cover.gemini-models=gemini-2.5-flash-image
ai.cover.connect-timeout-ms=1500
ai.cover.read-timeout-ms=4800
ai.cover.gemini-max-retries=2
# Groq AI
groq.api.key=${GROQ_API_KEY:}
groq.enabled=true
groq.model=llama-3.1-8b-instant
groq.timeout-ms=3500

# ===========================================
# EXTERNAL ADS PROVIDER (OPEN SOURCE / SELF-HOSTED)
# ===========================================


# DEV QUICK START (same Spring Boot app as external provider mock)
# Uncomment to enable immediately with the built-in external ads API.
external.ads.enabled=true
external.ads.base-url=http://localhost:8081/api/ext-ads
external.ads.api-key=dev-ads-key

# ===========================================
# VOICE WORKSHOP (ATELIER ORAL)
# ===========================================
voice.scoring.rules-version=voice-v1
voice.transcription.timeout-ms=15000
voice.transcription.browser-fallback-enabled=true