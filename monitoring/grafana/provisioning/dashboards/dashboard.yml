apiVersion: 1

providers:
  - name: EduGame
    orgId: 1
    folder: EduGame
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Le JSON du dashboard vit dans ce meme dossier (a cote de ce fichier), pour
      # n'avoir qu'un seul montage Docker (voir stage Monitoring du Jenkinsfile) --
      # un second -v imbrique dans /etc/grafana/provisioning (deja monte en lecture
      # seule) echoue au demarrage du conteneur (mountpoint impossible a creer).
      path: /etc/grafana/provisioning/dashboards
